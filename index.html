      <p>Household Chemistry needs JavaScript for the moving pictures. The short version: vinegar and baking soda make carbon dioxide; yeast turns sugar into alcohol and carbon dioxide; hard-water scale is calcium carbonate that vinegar can dissolve.</p>
      <p><strong>Never mix bleach with ammonia, vinegar, or other acids.</strong> Those mixtures can make chlorine gas or chloramine gases. If that happens, leave the room and get help. This page is education, not medical advice.</p>
